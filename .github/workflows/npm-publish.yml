name: Publish npm package

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vMAJOR.MINOR.PATCH tag to verify without publishing
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GHC_WASM_ARCHIVE_SHA256: 427ff65c863c8f708e84c2b3a07c6e7ac754cf84649833af45f6be3a4e2ccbd1
  GHC_WASM_FLAVOUR: '9.14'
  GHC_WASM_REVISION: e56b33ce9104349a75b5728def727d03ad0383fb
  NODE_VERSION: '24.21.0'
  NPM_VERSION: '12.2.0'
  PNPM_VERSION: '12.10.1'
  RUST_TOOLCHAIN: '1.99.0'

jobs:
  verify:
    name: Verify release archive
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: read # Required to enforce the release-blocker milestone gate.
      vulnerability-alerts: read # Required to enforce the Dependabot alert gate.
    outputs:
      archive_filename: ${{ steps.archive.outputs.archive_filename }}
      artifact_name: ${{ steps.archive.outputs.artifact_name }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Check out the release control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .release-control
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          sparse-checkout: /.github/scripts/
          sparse-checkout-cone-mode: false

      - name: Verify the release tag is on main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag $RELEASE_TAG must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main --no-tags
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$head_commit" != "$tag_commit" ]]; then
            echo "Checked out commit $head_commit does not match $RELEASE_TAG commit $tag_commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag $RELEASE_TAG is not contained in origin/main" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_WORKFLOW_SHA" origin/main; then
            echo "Workflow commit $GITHUB_WORKFLOW_SHA is not contained in origin/main" >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install the pinned npm CLI
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Verify release identity and security gates
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          node .release-control/.github/scripts/verify-release.mjs
          legacy_license_pattern='AG''PL|Aff''ero'
          if git grep -n -E "$legacy_license_pattern"; then
            echo "Tracked current-license references must be removed before publishing" >&2
            exit 1
          fi

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"

      - name: Install Rust build tools
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          fallback: none
          tool: cargo-llvm-cov@0.9.1,wasm-pack@0.15.0

      - name: Install ghc-wasm
        shell: bash
        run: bash .release-control/.github/scripts/install-ghc-wasm.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=low

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run release validation
        run: pnpm test

      - name: Build the release archive once
        id: archive
        run: node .release-control/.github/scripts/release-archive.mjs create "$RUNNER_TEMP/npm-release"

      - name: Upload the verified release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.archive.outputs.artifact_name }}
          path: ${{ runner.temp }}/npm-release
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release-assets:
    name: Attach verified release assets
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Required only to attach immutable assets to the matching GitHub Release.

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.release_tag }}

      - name: Check out the release control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .release-control
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          sparse-checkout: /.github/scripts/
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Download the verified release archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/npm-release

      - name: Attach immutable assets to the GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.release_version }}
        run: node .release-control/.github/scripts/release-assets.mjs "$RUNNER_TEMP/npm-release" "$RELEASE_VERSION" "$RELEASE_TAG"

  publish:
    name: Publish npm package
    if: github.event_name == 'release' && needs.verify.outputs.release_version != '0.3.0'
    needs:
      - release-assets
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm-publish
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing and provenance.

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.release_tag }}

      - name: Check out the release control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .release-control
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          sparse-checkout: /.github/scripts/
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install the pinned npm CLI
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Download the verified release archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/npm-release

      - name: Verify the release archive and OIDC environment
        id: archive
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.release_version }}
        run: node .release-control/.github/scripts/release-archive.mjs verify "$RUNNER_TEMP/npm-release" "$RELEASE_VERSION" --require-oidc

      - name: Publish the verified package
        env:
          RELEASE_ARCHIVE: ${{ steps.archive.outputs.archive_path }}
        run: npm publish "$RELEASE_ARCHIVE" --access public --registry https://registry.npmjs.org/
