name: Dependency compatibility canary

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dependency-canary.yml'
      - 'packages/oxiquill/**'
      - 'templates/basic/**'
      - 'tests/package/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-canary-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GHC_WASM_ARCHIVE_SHA256: 427ff65c863c8f708e84c2b3a07c6e7ac754cf84649833af45f6be3a4e2ccbd1
  GHC_WASM_FLAVOUR: '9.14'
  GHC_WASM_REVISION: e56b33ce9104349a75b5728def727d03ad0383fb
  NODE_VERSION: '24.21.0'
  PNPM_VERSION: '12.10.1'
  RUST_TOOLCHAIN: '1.99.0'

jobs:
  highest:
    name: Newest allowed dependencies (${{ matrix.package-manager }}, non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up Rust and Wasm target
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version | cut -d ' ' -f 2)" = "$RUST_TOOLCHAIN"
          test "$(cargo --version | cut -d ' ' -f 2)" = "$RUST_TOOLCHAIN"
      - name: Cache ghc-wasm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ghc-wasm
          key: ghc-wasm-${{ runner.os }}-${{ runner.arch }}-${{ env.GHC_WASM_FLAVOUR }}-${{ env.GHC_WASM_REVISION }}-${{ env.GHC_WASM_ARCHIVE_SHA256 }}
      - name: Install ghc-wasm
        shell: bash
        run: bash .github/scripts/install-ghc-wasm.sh
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Test newest allowed packed consumer with browser hydration
        env:
          OXIQUILL_CONSUMER_ARTIFACTS: compatibility-artifacts
        run: node tests/package/consumer-smoke.mjs --package-manager ${{ matrix.package-manager }} --profile highest --browser
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependencies-${{ matrix.package-manager }}-${{ matrix.node || 'current' }}
          path: compatibility-artifacts
          if-no-files-found: ignore
