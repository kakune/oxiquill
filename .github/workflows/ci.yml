name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GHC_WASM_ARCHIVE_SHA256: 82453d58b0ec5e1be8f162cb71f2c236ae96d5d81e18bf4574edc50883354e40
  GHC_WASM_FLAVOUR: '9.14'
  GHC_WASM_REVISION: 8fd59591635cb47ad7db124562039bea8441cae8
  NODE_VERSION: '24'
  PNPM_VERSION: '11.2.2'
  RUST_TOOLCHAIN: '1.95.0'

jobs:
  unit-coverage:
    name: Unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=low
      - name: Run unit coverage
        run: pnpm test:unit:coverage

  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          fallback: none
          tool: cargo-llvm-cov@0.9.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Rust lint, docs, and coverage
        run: pnpm test:rust:quality

  compatibility:
    name: Compatibility (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
          - label: macOS
            os: macos-latest
          - label: Windows
            os: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run compatibility checks
        run: pnpm test:compatibility

  packed-consumer:
    name: Packed consumer (${{ matrix.label }}, ${{ matrix.package-manager }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
            package-manager: npm
          - label: Linux
            os: ubuntu-latest
            package-manager: pnpm
          - label: macOS
            os: macos-latest
            package-manager: npm
          - label: macOS
            os: macos-latest
            package-manager: pnpm
          - label: Windows
            os: windows-latest
            package-manager: npm
          - label: Windows
            os: windows-latest
            package-manager: pnpm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up Rust and Wasm target
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - name: Install wasm-pack
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          fallback: none
          tool: wasm-pack@0.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test packed consumer
        run: pnpm "test:consumer:${{ matrix.package-manager }}"

  runtime:
    name: Runtime (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
          - label: macOS
            os: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up Rust and Wasm target
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - name: Install wasm-pack
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          fallback: none
          tool: wasm-pack@0.15.0
      - name: Cache ghc-wasm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ghc-wasm
          key: ghc-wasm-${{ runner.os }}-${{ runner.arch }}-${{ env.GHC_WASM_FLAVOUR }}-${{ env.GHC_WASM_REVISION }}-${{ env.GHC_WASM_ARCHIVE_SHA256 }}
      - name: Install ghc-wasm
        shell: bash
        run: bash .github/scripts/install-ghc-wasm.sh
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run generated runtime and static build tests
        run: pnpm test:runtime
      - name: Upload Linux browser site
        if: matrix.label == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-site
          path: examples/docs-site/dist
          if-no-files-found: error
          retention-days: 1

  browser:
    name: Browser (${{ matrix.label }})
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Chromium
            project: chromium
          - label: Firefox
            project: firefox
          - label: WebKit
            project: webkit
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download built browser site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-site
          path: examples/docs-site/dist
      - name: Install Playwright browser
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
        run: pnpm exec playwright install --with-deps "$PLAYWRIGHT_PROJECT"
      - name: Run browser suite
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
        run: pnpm test:e2e --project="$PLAYWRIGHT_PROJECT"
      - name: Upload failed browser report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
