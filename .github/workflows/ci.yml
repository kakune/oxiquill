name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GHC_WASM_ARCHIVE_SHA256: 427ff65c863c8f708e84c2b3a07c6e7ac754cf84649833af45f6be3a4e2ccbd1
  GHC_WASM_FLAVOUR: '9.14'
  GHC_WASM_REVISION: e56b33ce9104349a75b5728def727d03ad0383fb
  NODE_VERSION: '24.21.0'
  PNPM_VERSION: '12.10.1'
  RUST_TOOLCHAIN: '1.99.0'

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.changes.outputs.site }}
      runtime: ${{ steps.changes.outputs.runtime }}
      consumerLinux: ${{ steps.changes.outputs.consumerLinux }}
      consumerPlatforms: ${{ steps.changes.outputs.consumerPlatforms }}
      charts: ${{ steps.changes.outputs.charts }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Classify changed files
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/ci-changes.mjs

  js-quality:
    name: JavaScript quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=low
      - name: Build package types
        run: pnpm build:package
      - name: Run JavaScript lint, formatting, and types
        run: pnpm lint:js && pnpm format:check && pnpm check:types
      - name: Run unit coverage
        run: pnpm test:unit:coverage
      - name: Run documentation contract checks
        run: pnpm test:docs
      - name: Check CLI and package
        run: pnpm test:cli && pnpm test:package

  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          fallback: none
          tool: cargo-llvm-cov@0.9.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Rust lint, docs, and coverage
        run: pnpm test:rust:quality

  site-build:
    name: Site build
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      charts: ${{ needs.changes.outputs.charts }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up Rust and Wasm target
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - name: Install wasm-pack
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          fallback: none
          tool: wasm-pack@0.15.0
      - name: Cache ghc-wasm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ghc-wasm
          key: ghc-wasm-${{ runner.os }}-${{ runner.arch }}-${{ env.GHC_WASM_FLAVOUR }}-${{ env.GHC_WASM_REVISION }}-${{ env.GHC_WASM_ARCHIVE_SHA256 }}
      - name: Install ghc-wasm
        shell: bash
        run: bash .github/scripts/install-ghc-wasm.sh
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build browser site
        run: pnpm build
      - name: Upload Linux browser site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-site
          path: examples/docs-site/dist
          if-no-files-found: error
          retention-days: 1

  browser:
    name: Browser (${{ matrix.label }})
    needs: site-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Chromium
            project: chromium
          - label: Firefox
            project: firefox
          - label: WebKit
            project: webkit
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download built browser site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-site
          path: examples/docs-site/dist
      - name: Check browser bundle
        if: matrix.project == 'chromium'
        run: pnpm test:bundle
      - name: Install Playwright browser
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
        run: pnpm exec playwright install --with-deps "$PLAYWRIGHT_PROJECT"
      - name: Run browser suite
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
        run: pnpm test:e2e --project="$PLAYWRIGHT_PROJECT"
      - name: Prepare baseline chart sources
        if: always() && matrix.project == 'chromium' && needs.site-build.outputs.charts == 'true'
        env:
          CHART_BASE_REV: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/chart-base" "$CHART_BASE_REV"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/chart-base/node_modules"
          ln -s "$GITHUB_WORKSPACE/packages/oxiquill/node_modules" "$RUNNER_TEMP/chart-base/packages/oxiquill/node_modules"
      - name: Capture baseline chart gallery
        if: always() && matrix.project == 'chromium' && needs.site-build.outputs.charts == 'true'
        env:
          CHART_BASE_DIR: ${{ runner.temp }}/chart-base
        run: pnpm exec playwright test tests/e2e/chart-gallery.spec.ts --project=chromium --grep="chart gallery [0-9]+px" --output=test-results/before
      - name: Upload failed browser report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload chart gallery
        if: always() && matrix.project == 'chromium'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart-gallery-${{ github.run_attempt }}
          path: test-results/**/gallery-*.png
          if-no-files-found: error
          retention-days: 14

  runtime:
    name: Runtime
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up Rust and Wasm target
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - name: Install wasm-pack
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          fallback: none
          tool: wasm-pack@0.15.0
      - name: Cache ghc-wasm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ghc-wasm
          key: ghc-wasm-${{ runner.os }}-${{ runner.arch }}-${{ env.GHC_WASM_FLAVOUR }}-${{ env.GHC_WASM_REVISION }}-${{ env.GHC_WASM_ARCHIVE_SHA256 }}
      - name: Install ghc-wasm
        shell: bash
        run: bash .github/scripts/install-ghc-wasm.sh
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test generated runtimes
        run: pnpm test:wasm && pnpm test:haskell

  consumer-linux:
    name: Consumer (Linux)
    needs: changes
    if: needs.changes.outputs.consumerLinux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up Rust and Wasm target
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - name: Install wasm-pack
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          fallback: none
          tool: wasm-pack@0.15.0
      - name: Cache ghc-wasm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ghc-wasm
          key: ghc-wasm-${{ runner.os }}-${{ runner.arch }}-${{ env.GHC_WASM_FLAVOUR }}-${{ env.GHC_WASM_REVISION }}-${{ env.GHC_WASM_ARCHIVE_SHA256 }}
      - name: Install ghc-wasm
        shell: bash
        run: bash .github/scripts/install-ghc-wasm.sh
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Test npm consumer
        run: pnpm test:consumer:npm
      - name: Test pnpm consumer with browser hydration
        run: pnpm test:packed-browser
      - name: Run development HMR smoke
        run: pnpm test:dev-hmr

  consumer-macos:
    name: Consumer (macOS)
    needs: changes
    if: needs.changes.outputs.consumerPlatforms == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up Rust and Wasm target
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - name: Install wasm-pack
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          fallback: none
          tool: wasm-pack@0.15.0
      - name: Cache ghc-wasm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ghc-wasm
          key: ghc-wasm-${{ runner.os }}-${{ runner.arch }}-${{ env.GHC_WASM_FLAVOUR }}-${{ env.GHC_WASM_REVISION }}-${{ env.GHC_WASM_ARCHIVE_SHA256 }}
      - name: Install ghc-wasm
        shell: bash
        run: bash .github/scripts/install-ghc-wasm.sh
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test unit behavior
        run: pnpm test:unit
      - name: Test pnpm consumer
        run: pnpm test:consumer:pnpm

  consumer-windows:
    name: Consumer (Windows)
    needs: changes
    if: needs.changes.outputs.consumerPlatforms == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up Rust and Wasm target
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - name: Install wasm-pack
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          fallback: none
          tool: wasm-pack@0.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test unit behavior
        run: pnpm test:unit
      - name: Test npm consumer
        run: pnpm test:consumer:npm

  ci-ok:
    name: ci-ok
    needs:
      [
        changes,
        js-quality,
        rust-quality,
        site-build,
        browser,
        runtime,
        consumer-linux,
        consumer-macos,
        consumer-windows
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Require successful or intentionally skipped jobs
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-changes.mjs --check-results
