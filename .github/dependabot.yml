version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
      routine-updates:
        applies-to: version-updates
        patterns:
          - '*'
