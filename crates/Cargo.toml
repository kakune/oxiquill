[workspace]
members = ["doc-rust", "doc-rust-text"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_crate_dependencies = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
deprecated_safe = { level = "warn", priority = -1 }
keyword_idents = { level = "warn", priority = -1 }
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
non_ascii_idents = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_code = "warn"
unreachable_patterns = "warn"
unstable_features = "deny"
unused_must_use = "deny"
variant_size_differences = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -3 }
correctness = { level = "deny", priority = -3 }
suspicious = { level = "deny", priority = -3 }
complexity = { level = "deny", priority = -3 }
perf = { level = "deny", priority = -3 }
style = { level = "deny", priority = -3 }
pedantic = { level = "deny", priority = -2 }
nursery = { level = "deny", priority = -2 }
cargo = { level = "deny", priority = -2 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
string_slice = "deny"
integer_division = "deny"
arithmetic_side_effects = "deny"
float_arithmetic = "warn"
clone_on_ref_ptr = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
exit = "deny"
mem_forget = "deny"
multiple_inherent_impl = "deny"
empty_enums = "deny"
empty_structs_with_brackets = "deny"
enum_glob_use = "deny"
wildcard_imports = "deny"
absolute_paths = "warn"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
lossy_float_literal = "deny"
create_dir = "deny"
filetype_is_file = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
missing_assert_message = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"
multiple_crate_versions = "allow"
